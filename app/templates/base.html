<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}">
  <link rel="canonical" href="{{ canonical }}">

  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ canonical }}">
  <!-- Fetched at once rather than waiting for the stylesheet to be parsed
       and the font to be found in it. The display face sets the logo and
       every heading, so arriving late means those are painted in the
       fallback first and visibly reflow when the real one lands. -->
  <link rel="preload" href="/static/fonts/handjet-latin-wght-normal.woff2"
        as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/ibm-plex-mono-latin-400-normal.woff2"
        as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="/static/css/app.css">

  <!-- Applied before the page paints, so a first visit never shows the
       finished page for a frame before the opening sequence starts.
       intro.js removes it. Without scripting the noscript rule wins.

       A file rather than an inline script: our own CSP sets
       script-src 'self', which refuses inline scripts. -->
  <script src="/static/js/pending.js"></script>
  <noscript><style>.intro-pending body { visibility: visible !important; }</style></noscript>
</head>
<body data-intro="1"{% if route %} data-route="{{ route }}"{% endif %}>
  <!-- Falls from above on first load, then settles into the brand plate. -->
  <div class="intro-mark" aria-hidden="true">
    <svg viewBox="0 0 22 26" fill="none">
      <path d="M2 1h11l7 7v16a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1Z"
            stroke="currentColor" stroke-width="1.4"/>
      <path d="M13 1v7h7" stroke="currentColor" stroke-width="1.4"/>
      <rect x="5" y="14" width="12" height="5" rx="1" fill="var(--accent)"/>
    </svg>
  </div>

  <!-- Stays at the top of the window while the page scrolls under it. -->
  <header class="topbar-wrap">
    <div class="wrap">
      <div class="topbar">
        <a class="plate brand" href="/" id="brand-plate">
          <!-- The logo's mark is not drawn here. It is a single element that
               lives on the page and parks in this slot, so that scrolling
               moves the very same object rather than swapping one copy for
               another. This reserves its space so the word never shifts.

               Without scripting the slot simply stays empty and the word
               stands on its own, which still reads as the logo. -->
          <span class="brand-slot" id="brand-slot" aria-hidden="true">
            <svg width="22" height="26" viewBox="0 0 22 26" fill="none">
              <path d="M2 1h11l7 7v16a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1Z"
                    stroke="currentColor" stroke-width="1.6"/>
              <path d="M13 1v7h7" stroke="currentColor" stroke-width="1.6"/>
              <rect x="5" y="14" width="12" height="5" rx="1" fill="var(--accent)"/>
            </svg>
          </span>
          <span class="brand-word">RedPDF</span>
        </a>

        <nav class="plate navgroup" aria-label="Main">
          <a class="chip" href="{{ '#tools' if on_home else '/#tools' }}" data-watch="tools">
            Tools <span class="led"></span>
          </a>
          <a class="chip" href="{{ '#privacy' if on_home else '/#privacy' }}" data-watch="privacy">
            Privacy <span class="led"></span>
          </a>
          <a class="chip solid{% if on_workspace %} on{% endif %}" href="/workspace">
            Workspace <span class="led"></span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  {% block content %}{% endblock %}

  <div class="wrap">
    <footer>
      <nav aria-label="All tools">
        {% for tool in tools %}
          <a href="/{{ tool.slug }}">{{ tool.name }}</a>
        {% endfor %}
        <a href="/workspace">Workspace</a>
      </nav>
      <p>Your files stay on your computer. They are never sent to us.</p>
    </footer>
  </div>

  <script type="module" src="/static/js/intro.js"></script>
  <script type="module" src="/static/js/reveal.js"></script>
  <script type="module" src="/static/js/controls.js"></script>
  <script type="module" src="/static/js/nav.js"></script>
  <script type="module" src="/static/js/progress.js"></script>
</body>
</html>
