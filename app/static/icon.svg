<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The logo's document mark, drawn for a browser tab.

       The same page and folded corner the tool icons use, at the same
       proportions: their page is 14 by 18 with a 5 unit fold, so the fold is
       over a third of the width. Scaled to the 18 by 23 page here that is a
       6.5 unit fold, which stays open at sixteen pixels.

       An earlier attempt used a smaller fold and it closed up into a solid
       wedge, because the stroke needed at this size was wider than the gap
       the fold left. The fix is the proportion, not a thinner line.

       No background, so the tab's own colour shows through. That costs the
       mark its guaranteed contrast, which the rule below buys back: the
       outline follows the browser's theme rather than being fixed dark,
       since a dark outline on a dark tab strip is an invisible icon. -->
  <style>
    .ink { stroke: #201f1d }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #ebe8e3 }
    }
  </style>

  <!-- The page, with the top right corner cut away by the fold. -->
  <path class="ink" d="M6.5 4h11l7 7v17h-18z"
        fill="none" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- The fold, turning that corner back.

       Drawn a little thinner than the page outline so the triangle it makes
       keeps some space inside it. A fold is a line, a gap and another line,
       and if the strokes grow to meet in the middle the corner fills in and
       the mark reads as a page with a black wedge on it. -->
  <path class="ink" d="M17.5 4v7h7"
        fill="none" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- The accent bar, the one piece of colour and the thing that makes the
       mark recognisable at a glance. Kept the same red on either theme. -->
  <rect x="10.5" y="18" width="8" height="4.5" rx="1" fill="#c8452a"/>
</svg>
